name: IDX Stock Scanner

on:
  workflow_dispatch:
    inputs:
      sector:
        description: Sector to scan
        required: true
        default: IDXENERGY
        type: string
      limit:
        description: Maximum tickers per sector (blank scans all)
        required: false
        default: "5"
        type: string
      dry_run:
        description: Skip BigQuery upload
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "0 10 * * 1-5"

permissions:
  contents: read

defaults:
  run:
    working-directory: 03_data_engineering/batch-pipeline-idx-stock-scanner

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      BQ_DATASET_ID: ${{ vars.BQ_DATASET_ID }}
      BQ_TABLE_NAME: ${{ vars.BQ_TABLE_NAME }}
      # Perbaikan penanganan default input untuk schedule vs manual dispatch
      SCAN_SECTOR: ${{ inputs.sector || 'ALL' }}
      SCAN_LIMIT: ${{ inputs.limit || '' }}
      DRY_RUN: ${{ inputs.dry_run != false && 'true' || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Menangani Autentikasi GCP Service Account agar bigquery.Client() langsung mendeteksi kredensial
      - name: Authenticate to Google Cloud
        if: ${{ env.DRY_RUN == 'false' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir pyarrow
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Debug Installed Packages (Verify pyarrow)
        run: pip list | grep -E "pyarrow|google-cloud-bigquery" || true

      - name: Run stock scanner
        shell: bash
        run: |
          args=(--sector "$SCAN_SECTOR")
          if [[ -n "$SCAN_LIMIT" ]]; then
            args+=(--limit "$SCAN_LIMIT")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python main.py "${args[@]}"