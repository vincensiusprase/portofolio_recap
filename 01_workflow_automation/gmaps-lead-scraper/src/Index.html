<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- jQuery & Select2 CSS (Untuk Multi-Select Dropdown) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>
      body { background-color: #f4f6f9; padding: 25px; }
      .card { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
      .form-label { font-weight: 600; font-size: 0.88rem; color: #333; margin-bottom: 4px; }
      /* Adjust Select2 Styling to match Bootstrap */
      .select2-container--default .select2-selection--multiple {
        border: 1px solid #dee2e6;
        border-radius: 6px;
        min-height: 38px;
        padding: 2px 4px;
      }
      .select2-container--default.select2-container--focus .select2-selection--multiple {
        border-color: #86b7fe;
        box-shadow: 0 0 0 0.25rem rgba(13,110,253,.25);
      }
    </style>
  </head>
  <body>
    <div class="container max-w-xl" style="max-width: 820px;">
      <div class="card p-4">
        <h4 class="text-primary mb-1">🚀 B2B Leads Scraper Configurator</h4>
        <p class="text-muted small mb-4">Pilih kriteria dari dropdown atau ketik kustom baru (Multi-Select Tags).</p>

        <!-- Dynamic Location Multi-Select -->
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label mb-0">📍 Lokasi Target (Masterdata Sheet)</label>
            <button class="btn btn-sm btn-link p-0 text-decoration-none" onclick="loadMasterLocations()">🔄 Sync Sheet</button>
          </div>
          <select id="locations" class="form-select multi-select" multiple="multiple" style="width: 100%;">
            <!-- Loaded dynamically from Masterdata -->
          </select>
        </div>

        <!-- Queries Multi-Select -->
        <div class="mb-3">
          <label class="form-label">🔍 Search Queries</label>
          <select id="queries" class="form-select multi-select-tags" multiple="multiple" style="width: 100%;">
            <option value="Toko Kaca" selected>Toko Kaca</option>
            <option value="Kusen Aluminium" selected>Kusen Aluminium</option>
            <option value="Toko Kaca dan Aluminium" selected>Toko Kaca dan Aluminium</option>
            <option value="Glass & mirror shop" selected>Glass & mirror shop</option>
          </select>
        </div>

        <div class="row">
          <!-- Blacklist Names -->
          <div class="col-md-6 mb-3">
            <label class="form-label text-danger">🚫 Blacklist Nama (Filter Mutlak)</label>
            <select id="blacklistNames" class="form-select multi-select-tags" multiple="multiple" style="width: 100%;">
              <option value="warung" selected>warung</option>
              <option value="kelontong" selected>kelontong</option>
              <option value="sembako" selected>sembako</option>
              <option value="minimarket" selected>minimarket</option>
              <option value="alfamart" selected>alfamart</option>
              <option value="indomaret" selected>indomaret</option>
              <option value="kaca film" selected>kaca film</option>
              <option value="apotek" selected>apotek</option>
              <option value="laundry" selected>laundry</option>
            </select>
          </div>

          <!-- Whitelist Keywords -->
          <div class="col-md-6 mb-3">
            <label class="form-label text-success">✅ Whitelist Keywords (Pengecualian)</label>
            <select id="whitelistNames" class="form-select multi-select-tags" multiple="multiple" style="width: 100%;">
              <option value="kaca" selected>kaca</option>
              <option value="aluminium" selected>aluminium</option>
              <option value="alumunium" selected>alumunium</option>
              <option value="glass" selected>glass</option>
              <option value="mirror" selected>mirror</option>
              <option value="kusen" selected>kusen</option>
              <option value="etalase" selected>etalase</option>
              <option value="aquarium" selected>aquarium</option>
            </select>
          </div>
        </div>

        <div class="row">
          <!-- Bad Types -->
          <div class="col-md-8 mb-3">
            <label class="form-label text-warning">⚠️ Bad Category Types (Google API Types)</label>
            <select id="badTypes" class="form-select multi-select-tags" multiple="multiple" style="width: 100%;">
              <option value="convenience_store" selected>convenience_store</option>
              <option value="grocery_or_supermarket" selected>grocery_or_supermarket</option>
              <option value="home_goods_store" selected>home_goods_store</option>
              <option value="clothing_store" selected>clothing_store</option>
            </select>
          </div>

          <!-- Limit -->
          <div class="col-md-4 mb-3">
            <label class="form-label">🔢 Limit / Search</label>
            <input type="number" id="limit" class="form-control" value="15">
          </div>
        </div>

        <button id="btnStart" class="btn btn-primary w-100 fw-bold py-2 mt-2" onclick="runScraper()">▶️ Jalankan Scraping Leads</button>

        <div id="statusBox" class="alert alert-info mt-3 d-none" role="alert">
          <span id="statusText">Sedang memproses...</span>
        </div>
      </div>
    </div>

    <script>
      $(document).ready(function() {
        // Inisialisasi Select2 dengan dukungan penambahan opsi baru (tags)
        $('.multi-select-tags').select2({
          tags: true,
          tokenSeparators: [',']
        });

        $('.multi-select').select2({
          placeholder: "Memuat opsi..."
        });

        // Load lokasi dari Masterdata Sheet
        loadMasterLocations();
      });

      function loadMasterLocations() {
        google.script.run
          .withSuccessHandler((locations) => {
            const $locSelect = $('#locations');
            $locSelect.empty();
            
            locations.forEach(loc => {
              // Otomatis pilih semua opsi sebagai default
              const option = new Option(loc, loc, true, true);
              $locSelect.append(option);
            });
            
            $locSelect.trigger('change');
          })
          .withFailureHandler((err) => {
            alert("Gagal memuat Masterdata lokasi: " + err.message);
          })
          .getMasterLocations();
      }

      function getSelectValues(id) {
        const values = $(`#${id}`).val() || [];
        return values.map(v => v.trim().toLowerCase()).filter(v => v !== '');
      }

      function runScraper() {
        const btn = document.getElementById('btnStart');
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');

        btn.disabled = true;
        statusBox.className = "alert alert-info mt-3";
        statusBox.classList.remove('d-none');
        statusText.innerText = "⏳ Memproses pencarian Google Maps & menerapkan filter...";

        const payload = {
          locations: $('#locations').val() || [],
          queries: $('#queries').val() || [],
          blacklistNames: getSelectValues('blacklistNames'),
          whitelistNames: getSelectValues('whitelistNames'),
          badTypes: getSelectValues('badTypes'),
          limit: parseInt(document.getElementById('limit').value)
        };

        if (payload.locations.length === 0 || payload.queries.length === 0) {
          alert("Harap pilih setidaknya 1 Lokasi dan 1 Query!");
          btn.disabled = false;
          statusBox.classList.add('d-none');
          return;
        }

        google.script.run
          .withSuccessHandler((response) => {
            btn.disabled = false;
            statusText.innerText = `✅ SUKSES! Berhasil menambahkan ${response.totalNewPlaces} data leads baru!`;
            statusBox.className = "alert alert-success mt-3";
          })
          .withFailureHandler((err) => {
            btn.disabled = false;
            statusText.innerText = `❌ Error: ${err.message}`;
            statusBox.className = "alert alert-danger mt-3";
          })
          .startWebScraping(payload);
      }
    </script>
  </body>
</html>
